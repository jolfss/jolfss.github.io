{{ define "main" }}
<div class="field-lab" role="img" aria-label="A typography-free study of rounded cards and controls in regular page layouts.">
    <div class="field-lab__buttons">
        <div class="button field-shape"></div>
        <div class="button field-shape"></div>
        <div class="button field-shape"></div>
        <div class="button field-shape"></div>
    </div>

    <div class="field-lab__stack">
        <div class="pane field-shape field-lab__panel field-lab__panel--wide"></div>
        <div class="pane field-shape field-lab__panel field-lab__panel--wide is-soft"></div>
    </div>

    <div class="field-lab__center">
        <div class="pane field-shape field-lab__panel field-lab__panel--center is-tight"></div>
    </div>

    <div class="field-lab__pair">
        <div class="pane field-shape field-lab__panel field-lab__panel--pair"></div>
        <div class="pane field-shape field-lab__panel field-lab__panel--pair"></div>
    </div>

    <div class="field-lab__verticals">
        <div class="pane field-shape field-lab__panel field-lab__panel--vertical is-soft"></div>
        <div aria-hidden="true"></div>
        <div class="pane field-shape field-lab__panel field-lab__panel--vertical is-tight"></div>
    </div>

    <div class="pane field-shape field-lab__panel field-lab__panel--wide is-soft"></div>
</div>
{{ end }}
